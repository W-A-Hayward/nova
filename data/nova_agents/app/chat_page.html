<h1>Poser une question</h1>
<p class="muted small">Questions libres. Ce module nécessite Ollama. Les réponses sont vérifiées affirmation par affirmation, et chaque preuve ouvre le fichier au bon repère.
Pour les réponses de référence, voir <a href="/reponses">Réponses Q01–Q10</a>.</p>
<style>
#box{display:flex;flex-direction:column;height:72vh;border:1px solid var(--line);border-radius:8px;background:var(--card);overflow:hidden}
#messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{padding:10px 12px;border-radius:10px;max-width:85%;white-space:pre-wrap}
.me{align-self:flex-end;background:var(--acte);color:var(--surface)}
.bot{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
.meta{font-size:12px;margin-top:8px;padding-top:6px;border-top:1px solid var(--line);white-space:normal}
.evo{white-space:normal;font-size:13px;margin-top:8px;padding-top:6px;border-top:1px solid var(--line)}
.evo summary{cursor:pointer;font-weight:600}.evo .actuel{margin:4px 0 6px;padding:6px 8px;border-left:3px solid var(--ok)}
.evo ol{margin:4px 0 8px;padding-left:18px}.evo li{margin:3px 0}.evo .note{color:var(--muted);font-size:12px}
.evo li.passe{color:var(--muted)}
#bar{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
#bar button{margin:0}
</style>
<div id=box><div id=messages></div>
<div id=bar><input type=text id=q aria-label="Votre question" placeholder="Par exemple : qu'est-ce qui bloque encore le go-live?"><button id=send>Envoyer</button></div></div>
<p class=small><button id=effacer type=button hidden style="background:none;color:var(--muted);padding:0;text-decoration:underline">Effacer la conversation</button>
La conversation est gardée tant que le serveur tourne.</p>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function add(text, me, j) {
  const d = document.createElement('div');
  d.className = 'msg ' + (me ? 'me' : 'bot');
  let h = esc(text);
  if (j && j.evolution && j.evolution.length) {
    const cls = r => ({'historique':'r-passe','écarté':'r-passe','signal':'r-passe','proposition':'r-ouvert','livraison':'r-ouvert',
                      'mise à jour':'r-ouvert','décision':'r-acte','retenu':'r-acte','validation':'r-acte'}[r] || '');
    const lab = r => ({'historique':'historique, remplacé','écarté':'contredit, écarté','signal':'non fiable','livraison':'livraison (pas une validation)',
                      'retenu':'retenu','mise à jour':'mise à jour, à valider'}[r] || r);
    h += '<div class=evo><b>Évolution et sources contradictoires</b> <span class="small muted">(du plus ancien au plus récent ; '
       + 'l\'état actuel est tranché par la date du fait et l\'autorité de la source)</span>';
    j.evolution.forEach(sec => {
      h += `<details ${j.evolution.length < 3 ? 'open' : ''}><summary>${esc(sec.titre)}</summary>`
         + (sec.actuel ? `<div class=actuel><b>État actuel :</b> ${esc(sec.actuel)}</div>` : '')
         + '<ol>' + sec.entrees.map(e => `<li class="${['historique','écarté','signal'].includes(e.role) ? 'passe' : ''}">`
           + `${esc(e.date)}${e.heure ? ' ' + esc(e.heure) : ''} <span class="tag ${cls(e.role)}">${esc(lab(e.role))}</span> `
           + `${e.qui ? esc(e.qui) + ' : ' : ''}${esc(e.texte)} <a href="${esc(e.lien)}">${esc(e.source.court)}</a>`
           + (e.note ? `<div class=note>→ ${esc(e.note)}</div>` : '') + '</li>').join('') + '</ol></details>';
    });
    h += '</div>';
  }
  if (j) {
    if (j.preuves && j.preuves.length)
      h += '<div class=meta><b>Preuves citées :</b><br>' + j.preuves.map(p =>
        p.lien ? `<a href="${esc(p.lien)}">${esc(p.fichier)} : ${esc(p.repere)}</a>` : esc(p.source + ' ' + p.id)).join('<br>') + '</div>';
    if (j.rejetees && j.rejetees.length)
      h += '<div class="meta bad"><b>' + j.rejetees.length + ' affirmation(s) rejetée(s) par la vérification :</b><br>' +
        j.rejetees.slice(0, 5).map(r => esc(r.texte) + ' (' + esc((r.problemes || []).join('; ')) + ')').join('<br>') + '</div>';
  }
  d.innerHTML = h;
  messages.appendChild(d);
  messages.scrollTop = messages.scrollHeight;
}
// La conversation vit côté serveur (mémoire du processus): elle est reprise en revenant sur la page,
// une réponse en cours continue d'arriver, et tout disparaît à l'arrêt du serveur.
const ACCUEIL = 'Posez une question sur NOVA (état au 30 septembre 2026, 9 h). La réponse donne l\'état actuel, puis l\'évolution des décisions et les sources contradictoires, chacune avec son lien.';
let attente = null;
function rendre(hist) {
  messages.innerHTML = '';
  add(ACCUEIL, false);
  hist.forEach(m => {
    if (m.role === 'user') add(m.texte, true);
    else if (m.statut === 'ok') add(m.reponse.reponse || '(pas de réponse)', false, m.reponse);
    else if (m.statut === 'erreur') add('Erreur : ' + m.message + ' (Ollama est-il lancé?)', false);
    else add('Réponse en cours… (' + Math.round(Date.now() / 1000 - m.debut) + ' s) Vous pouvez changer de page : la réponse sera là au retour.', false);
  });
  const enCours = hist.some(m => m.statut === 'en cours');
  send.disabled = enCours; send.textContent = enCours ? '…' : 'Envoyer';
  effacer.hidden = !hist.length;
  clearTimeout(attente);
  if (enCours) attente = setTimeout(charger, 2000);
}
async function charger() {
  try { rendre(await (await fetch('/api/session/chat')).json()); }
  catch (err) { add('Erreur : ' + err.message, false); }
}
async function go() {
  const question = q.value.trim();
  if (!question || send.disabled) return;
  q.value = ''; garderSaisie();
  add(question, true); add('Réponse en cours…', false);
  send.disabled = true; send.textContent = '…';
  clearTimeout(attente); attente = setTimeout(charger, 2000);  // l'état du serveur fait foi, même si la requête est coupée
  try { await fetch('/api/chat', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({question})}); }
  catch (err) { /* page quittée ou réseau: la réponse reste conservée par le serveur */ }
  await charger(); q.focus();
}
let minuteur = null;
function garderSaisie() {
  clearTimeout(minuteur);
  minuteur = setTimeout(() => fetch('/api/session/saisie', {method: 'PUT', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({cle: 'chat_question', valeur: q.value})}), 300);
}
send.onclick = go;
effacer.onclick = async () => { rendre(await (await fetch('/api/session/chat', {method: 'DELETE'})).json()); };
q.addEventListener('input', garderSaisie);
q.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); go(); } });
fetch('/api/session/saisie').then(r => r.json()).then(s => { if (s.chat_question && !q.value) q.value = s.chat_question; });
charger();
</script>
